name: daily digest

on:
  schedule:
    - cron: "30 13 * * *" # ~06:30 Pacific
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install .

      # profile.md is gitignored (personal data); CI materializes it from a
      # secret. If the secret is unset the run degrades to keyword ranking.
      - name: Write profile from secret
        env:
          PROFILE_MD: ${{ secrets.PROFILE_MD }}
        run: |
          if [ -n "$PROFILE_MD" ]; then
            printf '%s\n' "$PROFILE_MD" > profile.md
          else
            echo "PROFILE_MD secret not set — LLM scoring will be skipped"
          fi

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python -m jobradar run

      - name: Commit DB and cleared feedback
        run: |
          git config user.name "job-radar bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.db feedback.txt
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "daily run $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
