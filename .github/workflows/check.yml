# Setup check: validates the GEMINI_API_KEY and Gmail credentials without
# running the pipeline. Run this after setting/rotating any secret.
name: setup check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'EOF'
          import smtplib
          from google import genai
          from google.genai import types
          from jobradar.config import DEFAULT_MODEL, Settings

          settings = Settings.from_env()

          r = genai.Client(api_key=settings.gemini_api_key).models.generate_content(
              model=settings.model,
              contents="Reply with the single word OK.",
              config=types.GenerateContentConfig(max_output_tokens=500),
          )
          print(f"Gemini OK ({settings.model}):", (r.text or "<empty>").strip()[:40])

          password = settings.gmail_app_password.replace(" ", "")
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as s:
              s.login(settings.gmail_address, password)
          print("Gmail SMTP login OK")
          EOF
